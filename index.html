<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #8a94a0;
    --accent: #2f9e6e;
    --accent-dark: #257d56;
    --danger: #d64545;
    --border: #e3e8ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161a;
      --card: #1c2228;
      --text: #e6eaee;
      --muted: #7d8894;
      --accent: #3fb884;
      --accent-dark: #349d70;
      --danger: #ef6a6a;
      --border: #2c343c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .summary { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
  }
  .add-btn {
    padding: 0 20px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .add-btn:hover { background: var(--accent-dark); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .label {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  .del-btn {
    background: none;
    color: var(--muted);
    font-size: 18px;
    padding: 4px 8px;
  }
  .del-btn:hover { color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 15px;
  }
  .footer { display: flex; justify-content: flex-end; margin-top: 16px; }
  .clear-btn {
    background: none;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 10px;
  }
  .clear-btn:hover { color: var(--danger); }
  .clear-btn[hidden] { display: none; }
</style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary"></p>

    <form id="add-form">
      <input type="text" id="new-item" placeholder="사야 할 물건을 입력하세요" autocomplete="off" autofocus>
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">아직 추가된 아이템이 없어요.</p>

    <div class="footer">
      <button type="button" class="clear-btn" id="clear-done" hidden>체크한 항목 모두 삭제</button>
    </div>
  </main>

<script>
  const STORAGE_KEY = "shopping-list-items";
  let items = load();

  const form = document.getElementById("add-form");
  const input = document.getElementById("new-item");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const summaryEl = document.getElementById("summary");
  const clearBtn = document.getElementById("clear-done");

  // HTML 태그를 제거하고 텍스트만 남긴다 (DOMParser는 스크립트를 실행하지 않는다)
  function clean(text) {
    const doc = new DOMParser().parseFromString(String(text), "text/html");
    return doc.body.textContent.replace(/\s+/g, " ").trim();
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!Array.isArray(data)) return [];
      return data
        .map(item => ({ ...item, text: clean(item.text) }))
        .filter(item => item.text);
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch {}
  }

  function render() {
    listEl.replaceChildren();

    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = item.done;
      check.addEventListener("change", () => toggle(item.id));

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.text;
      label.addEventListener("click", () => toggle(item.id));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.textContent = "✕";
      del.setAttribute("aria-label", `${item.text} 삭제`);
      del.addEventListener("click", () => remove(item.id));

      li.append(check, label, del);
      listEl.append(li);
    }

    const doneCount = items.filter(i => i.done).length;
    emptyEl.hidden = items.length > 0;
    clearBtn.hidden = doneCount === 0;
    summaryEl.textContent = items.length
      ? `${items.length}개 중 ${doneCount}개 완료`
      : "";
  }

  function add(text) {
    items.push({ id: Date.now() + Math.random(), text, done: false });
    save();
    render();
  }

  function toggle(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function remove(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = clean(input.value);
    if (text) add(text);
    input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", () => {
    items = items.filter(i => !i.done);
    save();
    render();
  });

  render();
</script>
</body>
</html>
